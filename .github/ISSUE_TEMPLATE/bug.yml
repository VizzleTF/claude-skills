name: Bug report
description: Something works wrong or the band looks broken
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin and version
      description: From `claude plugin list`, for example `tidemark 0.1.0`
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and terminal
      description: For example `macOS 15, iTerm2` or `Windows 11, WSL, Windows Terminal`
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
      description: A screenshot of the band helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: config
    attributes:
      label: Config
      description: Your tidemark config file, if the bug is about tidemark
      render: json
