name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Repo checks
        run: |
          python3 -m unittest discover -s tests
          python3 tools/parity.py
          python3 plugins/technical-writing/skills/write/scripts/check.py plugins/technical-writing/skills/write/
          python3 plugins/technical-writing/skills/write/scripts/check.py plugins/technical-writing-ru/skills/write/
      - name: Version bumps
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # Exit 2 means the base is not in history (new branch, force push): nothing to compare.
        run: python3 tools/version_check.py "$BASE" || [ $? -eq 2 ]
      - name: Manifests
        run: |
          claude plugin validate --strict .
          for p in plugins/*/; do claude plugin validate --strict "$p"; done
      - name: tidemark tests
        run: claude plugin test plugins/tidemark
      - name: tidemark type check
        # The engine lays the API types into .claude-plugin/types/ when it loads the mod; a headless run with
        # a dummy key loads it and stops at the 401, so no model call is made.
        run: |
          ANTHROPIC_API_KEY=dummy claude -p --plugin-dir plugins/tidemark hi >/dev/null 2>&1 || true
          test -f plugins/tidemark/.claude-plugin/types/claude-code/index.d.ts
          npx -y -p typescript@5.6.3 tsc -p plugins/tidemark
